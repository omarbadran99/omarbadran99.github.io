function metric(title,value,sub,ico,dark=false){return '<div class="card metric '+(dark?'dark':'')+'"><div class="metric-title">'+esc(title)+icon(ico)+'</div><div class="metric-value mono">'+esc(value)+'</div><div class="metric-sub">'+sub+'</div></div>'}
function lineChart(){const months=[],now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),label:d.toLocaleDateString(LOCALE,{month:'short'}),income:0,expense:0})}for(const p of db.payments.filter(p=>p.year===db.activeYear&&!p.voidedAt)){const m=months.find(m=>m.key===p.date.slice(0,7));if(m)m.income+=p.amount}for(const e of db.entries.filter(e=>e.year===db.activeYear&&!e.voidedAt)){const m=months.find(m=>m.key===e.date.slice(0,7));if(m)m[e.kind==='income'?'income':'expense']+=e.amount}const w=670,h=220,l=57,r=17,t=17,b=31,max=Math.max(10000,...months.flatMap(m=>[m.income,m.expense]))*1.2,X=i=>l+i*(w-l-r)/5,Y=v=>h-b-v/max*(h-t-b),pts=k=>months.map((m,i)=>X(i)+','+Y(m[k])).join(' ');let s='<svg class="linechart" viewBox="0 0 670 220" role="img" aria-label="الإيرادات والمصروفات خلال آخر ستة أشهر ميلادية"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#55966d" stop-opacity=".18"/><stop offset="100%" stop-color="#55966d" stop-opacity="0"/></linearGradient></defs>';for(let i=0;i<5;i++){const val=max*i/4,y=Y(val);s+='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+y+'" y2="'+y+'" stroke="#edf1e9" stroke-dasharray="3 5"/><text x="'+(l-11)+'" y="'+(y+3)+'" text-anchor="end" fill="#99a292" font-size="10">'+esc(new Intl.NumberFormat(LOCALE,{notation:'compact',maximumFractionDigits:1}).format(val/100))+'</text>'}s+='<polygon points="'+l+','+Y(0)+' '+pts('income')+' '+X(5)+','+Y(0)+'" fill="url(#fill)"/><polyline points="'+pts('income')+'" fill="none" stroke="#518665" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="'+pts('expense')+'" fill="none" stroke="#c6a16a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>';months.forEach((m,i)=>{s+='<text x="'+X(i)+'" y="'+(h-5)+'" text-anchor="middle" fill="#8b9789" font-size="10">'+m.label+'</text>';for(const k of ['income','expense'])s+='<circle cx="'+X(i)+'" cy="'+Y(m[k])+'" r="3.5" fill="'+(k==='income'?'#518665':'#c6a16a')+'" stroke="white" stroke-width="2"><title>'+m.label+' '+arLabel(k)+': '+esc(money(m[k]))+'</title></circle>'});return s+'</svg>'}
function donut(t){const pct=t.expected?t.received/t.expected:0,first=t.expected?t.first/t.expected:0,second=t.expected?t.final/t.expected:0,c=464.956;return '<div class="donutwrap"><svg class="donut" viewBox="0 0 184 184" role="img" aria-label="'+Math.round(pct*100)+' بالمئة من الرسوم السنوية محصّلة"><circle cx="92" cy="92" r="74" fill="none" stroke="#edf1e5" stroke-width="18"/><circle cx="92" cy="92" r="74" fill="none" stroke="#296d54" stroke-width="18" stroke-dasharray="'+first*c+' '+c+'"/><circle cx="92" cy="92" r="74" fill="none" stroke="#9db887" stroke-width="18" stroke-dasharray="'+second*c+' '+c+'" stroke-dashoffset="'+(-first*c)+'"/></svg><div class="donuttext"><b>'+Math.round(pct*100)+'<span style="display:inline;font-size:19px;color:inherit">%</span></b><span>من الرسوم السنوية</span></div></div>'}
function cohortBars(){const groups={};for(const s of roster()){const g=s.className||'غير محدد';if(!groups[g])groups[g]={expected:0,paid:0,count:0};groups[g].expected+=s.enrollments[db.activeYear].fee;groups[g].paid+=paid(s,1)+paid(s,2);groups[g].count++}const arr=Object.entries(groups).sort((a,b)=>b[1].paid-a[1].paid).slice(0,5);return arr.length?'<div class="barlist">'+arr.map(([name,g])=>'<div><div class="bar-top"><span>'+esc(name)+'</span><b>'+esc(money(g.paid,true))+'</b></div><div class="bar"><i style="width:'+(g.expected?g.paid/g.expected*100:0)+'%"></i></div><div class="bars-sub"><span>'+g.count+' طالبًا</span><span>'+Math.round(g.expected?g.paid/g.expected*100:0)+'% محصّل</span></div></div>').join('')+'</div>':empty('ستظهر صفوفك هنا','أضف الطلاب لمتابعة نسب التحصيل حسب الصف.')}
function renderDashboard(){const t=totals(),recent=db.payments.filter(p=>p.year===db.activeYear&&!p.voidedAt).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)).slice(0,5);return pageHead('صورة أوضح لمركزك.','كل طالب وكل دفعة، في مكان واحد.',button('استيراد الطلاب','import','upload')+button('تسجيل دفعة','payment','plus','primary'),'مركزك في لمحة')+'<div class="cards">'+metric('الرسوم المحصّلة',money(t.received,true),'<span class="pill">'+Math.round(t.expected?t.received/t.expected*100:0)+'% محصّل</span> <span>من '+esc(money(t.expected,true))+' متوقعة</span>','wallet',true)+metric('الرسوم المتبقية',money(t.outstanding,true),'<span style="color:'+(t.overdue?'#b67e3c':'#8b968e')+'">'+esc(money(t.overdue,true))+' متأخر</span> · للفصلين','calendar')+metric('صافي التدفق النقدي',money(t.net,true),'الإيرادات '+esc(money(t.received+t.income,true))+' − المصروفات '+esc(money(t.expenses,true)),'trend')+metric('الطلاب المسجّلون',String(roster().length),new Set(roster().map(s=>s.className).filter(Boolean)).size+' صفوف · '+esc(year().label),'students')+'</div><div class="chartgrid"><section class="card"><div class="cardhead"><div><h2>الإيرادات والمصروفات</h2><p>آخر ٦ أشهر ميلادية · سجلات السنة الدراسية المحددة</p></div><div class="legend"><span><i class="dot" style="background:#518665"></i>الإيرادات</span><span><i class="dot" style="background:#c6a16a"></i>المصروفات</span></div></div><div class="cardbody">'+lineChart()+'<div class="chart-foot"><span>إيرادات السنة <strong>'+esc(money(t.received+t.income,true))+'</strong></span><span>مصروفات السنة <strong>'+esc(money(t.expenses,true))+'</strong></span></div></div></section><section class="card"><div class="cardhead"><div><h2>تحصيل الرسوم</h2><p>فصلان دراسيان وصورة مالية متكاملة.</p></div><span class="tag">'+esc(year().label)+'</span></div><div class="cardbody">'+donut(t)+'<div class="legendrows"><div class="legendrow"><i class="dot" style="background:#296d54"></i>المحصّل للفصل الأول<b>'+esc(money(t.fir function studentCell(s){if(!s)return 'طالب غير معروف';return '<div class="studentcell"><div class="avatar">'+esc(initials(s))+'</div><div><button class="linkbtn" data-a="profile" data-id="'+s.id+'"><b dir="auto">'+esc(fullName(s))+'</b></button><small dir="auto">'+esc(s.className||'غير محدد')+'</small></div></div>'}

function renderProfile(){const s=db.students.find(s=>s.id===profileId);if(!s||!s.enrollments[db.activeYear])return empty('الطالب غير مسجّل في هذه السنة','اختر السنة الدراسية التي سُجّل فيها هذا الطالب.',button('العودة إلى الطلاب','view-students','back'));const e=s.enrollments[db.activeYear],ps=db.payments.filter(p=>p.studentId===s.id&&p.year===db.activeYear).sort((a,b)=>b.date.localeCompare(a.date));return '<div style="margin-bottom:18px">'+button('جميع الطلاب','view-students','back','ghost sm')+'</div><div class="pagehead"><div class="profilehead"><div class="avatar">'+esc(initials(s))+'</div><div><div class="eyebrow">ملف الطالب · '+esc(year().label)+'</div><h1 dir="auto">'+esc(fullName(s))+'</h1><p>'+esc(s.className||'غير محدد')+' · '+esc(s.teacher||'لم يُحدّد المعلم')+'</p></div></div><div class="flex">'+button('تعديل الملف','student','edit','',s.id)+button('تسجيل دفعة','payment','plus','primary',s.id)+'</div></div><div class="card" style="margin-bottom:22px"><div class="cardbody detailgrid">'+[['ولي الأمر',s.parentName],['رقم التواصل',s.phone],['البريد الإلكتروني',s.email],['تاريخ التسجيل',dateFmt(e.enrolled)],['الرسوم السنوية',money(e.fee)],['ملاحظات',s.note||e.note]].map(([k,v])=>'<div><label>'+k+'</label><strong dir="auto">'+esc(v||'—')+'</strong></div>').join('')+'</div></div><div class="grid2 equal" style="margin-bottom:22px">'+[1,2].map(t=>{const a=termInfo(s,t);return '<section class="card termcard"><div class="flex between"><h2>'+(t===1?'الفصل الأول':'الفصل الثاني')+'</h2>'+statusBadge(a.status)+'</div><div class="value">'+esc(money(a.remaining))+'</div><span class="muted small">المتبقي من '+esc(money(a.expected))+'</span><div class="progressbig"><span style="width:'+(a.expected?a.paid/a.expected*100:100)+'%"></span></div><div class="termmeta"><div><small>المحصّل</small><b>'+esc(money(a.paid))+'</b></div><div><small>موعد الاستحقاق</small><b>'+dateFmt(a.due)+'</b></div></div><div class="flex wrap">'+(a.remaining?button('إضافة دفعة','payment-term','plus',' function openModal(title,subtitle,body,wide=false){modalReturn=document.activeElement;$('#modalRoot').innerHTML='<div class="modalback"><section class="modal '+(wide?'wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><div><h2 id="modalTitle">'+esc(title)+'</h2><p>'+esc(subtitle)+'</p></div><button class="iconbtn" data-a="close" aria-label="إغلاق النافذة">'+icon('close')+'</button></div><div class="modalbody">'+body+'</div></section></div>';document.body.style.overflow='hidden';hydrate($('#modalRoot'));setTimeout(()=>$('.modal input:not([type="checkbox"]),.modal select,.modal button')?.focus(),40)}

function openPayment(id,term=1){if(!roster().length){openStudent();toast('أضف طالبًا قبل تسجيل أي دفعة.');return}const list=roster().sort((a,b)=>fullName(a).localeCompare(fullName(b),'ar'));const selected=list.find(s=>s.id===id)||list.find(s=>termInfo(s,1).remaining>0)||list[0];openModal('تسجيل دفعة','سجّل مبلغًا استُلم بالفعل. لا تنفّذ هذه العملية خصمًا من بطاقة أو تحويلًا بنكيًا.','<form id="paymentForm"><div class="formgrid"><div class="full">'+selectField('الطالب','studentId',list.map(s=>option(s.id,fullName(s)+' · '+(s.className||'غير محدد'),selected.id)).join(''),'required')+'</div>'+selectField('الفصل الدراسي','term',option(1,'الفصل الأول',term)+option(2,'الفصل الثاني',term))+field('تاريخ الدفع','date',today(),'date','required max="'+today()+'"')+field('المبلغ المستلم','amount','','number','required min="0.01" step="0.01"')+selectField('طريقة الدفع','method',methods.map(m=>option(m)).join(''))+'<div class="full">'+field('مرجع التحويل أو الدفع','reference','','text','maxlength="100"','مرجع خارجي اختياري للعملية. لا تُدخل بيانات البطاقة.')+'</div><div class="formgroup full"><label for="paymentNote">ملاحظة داخلية</label><textarea id="paymentNote" name="note" maxlength="1000"></textarea></div></div><div id="paymentBalance" class="amountpreview"></div>'+modalFooter('حفظ الدفعة والإيصال')+'</form>');updatePaymentBalance()}
function updatePaymentBalance(){const f=$('#paymentForm');if(!f)return;const s=db.students.find(s=>s.id===f.elements.studentId.value),a=termInfo(s,Number(f.elements.term.value));f.elements.amount.max=(a.remaining/100).toFixed(2);f.elements.amount.value=a.remaining>0?(a.remaining/100).toFixed(2):'';$('#paymentBalance').innerHTML='<span>رسوم الفصل <b>'+esc(money(a.expected))+'</b></span><span>المتبقي <b>'+esc(money(a.remaining))+'</b></span>';f.querySelector('[type="submit"]').disabled=a.remaining<=0}

function showReceipt(id){const p=db.payments.find(p=>p.id===id);if(!p)return;const s=db.students.find(s=>s.id===p.studentId),y=db.years.find(y=>y.id===p.year);openModal('إيصال دفع',p.receipt,receiptHTML(p,s,y)+'<div class="formfoot">'+button('إغلاق','close')+button('طباعة أو حفظ PDF','print-receipt','print','primary',p.id)+'</div>')}

function openReminder(idterm){const [id,t]=idterm.split(':'),term=Number(t),s=db.students.find(s=>s.id===id),a=termInfo(s,term);if(a.remaining<=0){toast('لا يوجد مبلغ متبقٍ لهذا الفصل.');return}const subject=db.settings.name+' · تذكير برسوم '+(term===1?'الفصل الأول':'الفصل الثاني'),text='السيد/السيدة '+(s.parentName||'ولي أمر الطالب')+'،\n\nنود تذكيركم برسوم '+(term===1?'الفصل الأول':'الفصل الثاني')+' للطالب '+fullName(s)+' في '+db.settings.name+' للعام الدراسي '+year().label+'.\n\nرسوم الفصل: '+money(a.expected)+'\nالمبلغ المسدّد: '+money(a.paid)+'\nالمبلغ المتبقي: '+money(a.remaining)+'\nموعد الاستحقاق: '+dateFmt(a.due)+'\n\nإذا كنتم قد سددتم المبلغ، يرجى تزويدنا بمرجع الدفع لتحديث سجلاتنا.\n\nشكرًا لتعاونكم،\n'+db.settings.name+(db.settings.contact?'\n'+db.settings.contact:'');openModal('تجهيز رسالة تذكير بالسداد','مسودة تراجعها وترسلها من تطبيق البريد الإلكتروني أو الرسائل على جهازك.','<form id="reminderForm" data-id="'+s.id+'" data-term="'+term+'">'+field('الموضوع','subject',subject,'text','required maxlength="200"')+'<div class="formgroup" style="margin-top:15px"><label for="reminderText">نص الرسالة</label><textarea id="reminderText" name="message" style="min-height:270px" required maxlength="5000">'+esc(text)+'</textarea></div><div class="helpbox" style="margin-top:15px">'+esc(s.email?'البريد الإلكتروني: '+s.email:'لم يُسجّل بريد إلكتروني.')+'<br>'+esc(s.phone?'الهاتف: '+s.phone:'لم يُسجّل رقم هاتف.')+'<br>فتح تطبيق البريد أو الرسائل لا يؤكد الإرسال أو الوصول.</div><div class="formfoot" style="flex-wrap:wrap">'+button('نسخ الرسالة','copy-reminder','file')+(s.email?button('فتح البريد الإلكتروني','email-reminder','mail'):'')+(s.phone?button('فتح تطبيق الرسائل','sms-reminder','mail'):'')+'<button type="submit" class="btn primary">تسجيل المسودة والإغلاق</button></div></form>')}

function parseCSV(text){text=text.replace(/^\uFEFF/,'');const sample=text.split(/\r?\n/).slice(0,4).join('\n');let sep=',',best=0;for(const candidate of [',',';','\t']){let count=0,quote=false;for(let i=0;i<sample.length;i++){if(sample[i]==='"'){if(quote&&sample[i+1]==='"')i++;else quote=!quote}else if(!quote&&sample[i]===candidate)count++}if(count>best){best=count;sep=candidate}}let rows=[],row=[],cell='',quoted=false,closed=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;closed=true}}else cell+=ch}else if(ch==='"'){if(cell.trim())throw Error('توجد علامة اقتباس غير متوقعة في الملف. أعد تصديره بترميز UTF-8 وحاول مجددًا.');quoted=true}else if(ch===sep){row.push(cell.trim());cell='';closed=false}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell='';closed=false}else{if(closed&&!/\s/.test(ch))throw Error('يوجد نص غير متوقع بعد حقل محاط بعلامتي اقتباس.');cell+=ch}}if(quoted)throw Error('يوجد حقل لم تُغلق علامة اقتباسه.');row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);if(rows.length<2)throw Error('يجب أن يتضمن الملف صف عناوين وصف طالب واحدًا على الأقل.');if(rows.length>10001)throw Error('الحد الأقصى للاستيراد ١٠٬٠٠٠ طالب لكل ملف.');const headers=rows.shift();if(headers.length>60)throw Error('يحتوي الملف على عدد أعمدة يتجاوز الحد المسموح.');if(new Set(headers.map(h=>h.toLowerCase())).size!==headers.length)throw Error('يجب أن تكون عناوين الأعمدة غير مكررة.');const wrong=rows.findIndex(r=>r.length>headers.length);if(wrong>=0)throw Error('الصف رقم '+(wrong+2)+' يحتوي على خلايا أكثر من عدد الأعمدة.');return {headers,rows}}
const importFields=[['firstName','اسم الطالب *',['studentname','studentfirstname','firstname','givenname','שםפרטי','اسمالطالب','الاسم']],['familyName','اسم العائلة *',['studentfamilyname','familyname','lastname','surname','שםמשפחה','العائلة','اسمالعائلة']],['parentName','ولي الأمر',['studentparentname','parentname','parent','guardian','שםהורה','اسمالاب','اسمالأب','وليالامر']],['className','الصف أو المجموعة',['class','classname','cohort','group','כיתה','الصف']],['teacher','المعلم',['teacher','teachername','מורה','المعلم']],['phone','الهاتف',['phone','mobile','telephone','טלפון','هاتف']],['email','البريد الإلكتروني',['email','emailaddress','דואראלקטרוני','البريدالالكتروني']],['fee','الرسوم السنوية (اختياري)',['annualtuition','annualfee','yearlyfee','tuition','fee']],['first','رسوم الفصل الأول (اختياري)',['firsttermfee','firstterm','firsttermamount']],['enrolled','تاريخ التسجيل (سنة-شهر-يوم)',['enrollmentdate','enrolled','date']]];

function normalizeHeader(s){return s.toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/[\s_\-()./]/g,'')}

function mapImport(parsed){importState={...parsed,map:{}};for(const [key,label,aliases] of importFields){const idx=parsed.headers.findIndex(h=>aliases.includes(normalizeHeader(h)));importState.map[key]=idx}let html='<form id="importMapForm"><div class="importsteps"><span>١ / رفع الملف</span><b>٢ / ربط الأعمدة</b><span>٣ / المراجعة</span></div><div class="helpbox">'+parsed.rows.length+' صفوف. اربط كل عمود بالحقل المناسب في ملف الطالب.</div><div class="formgrid">'+importFields.map(([key,label])=>selectField(label,key,option(-1,'عدم الاستيراد',importState.map[key])+parsed.headers.map((h,i)=>option(i,h,importState.map[key])).join(''))).join('')+'</div><div class="formgroup" style="margin-top:18px"><label for="duplicateMode">عند تطابق الاسم وولي الأمر والصف تمامًا</label><select name="duplicateMode" id="duplicateMode">'+option('skip','تجاهل الصفوف المكررة (موصى به)')+option('update','تحديث بيانات التواصل والمعلم فقط')+'</select><small>تُطابق السجلات حسب اسم الطالب والعائلة وولي الأمر والصف. يُربط طلاب السنوات الأخرى بملفاتهم ويُسجّلون في السنة الحالية، دون استبدال رسومهم أو دفعاتهم السابقة.</small></div>'+modalFooter('مراجعة الاستيراد')+'</form>';openModal('اربط أعمدة ملف الطلاب','مراجعة سريعة تمنحك استيرادًا واضح النتائج.',html,true)}
function studentKey(s){return [s.firstName,s.familyName,s.parentName,s.className].map(v=>String(v||'').trim().toLocaleLowerCase().replace(/\s+/g,' ')).join('|')}
function prepareImport(f){const mapping={};for(const [key] of importFields)mapping[key]=Number(f.elements[key].value);if(mapping.firstName<0||mapping.familyName<0)throw Error('اربط عمود اسم الطالب وعمود اسم العائلة.');const used=Object.values(mapping).filter(v=>v>=0);if(new Set(used).size!==used.length)throw Error('يمكن ربط كل عمود بحقل واحد فقط.');const seen=new Set(),preview=[],mode=f.elements.duplicateMode.value;for(let i=0;i<importState.rows.length;i++){const r=importState.rows[i],s={};for(const [k,idx] of Object.entries(mapping))s[k]=idx<0?'':(r[idx]||'').trim();let error='',action='add';try{if(!s.firstName||!s.familyName)throw Error('اسم الطالب واسم العائلة مطلوبان.');for(const key of ['firstName','familyName','parentName','className','teacher','phone','email'])if(s[key].length>160)throw Error(({firstName:'اسم الطالب',familyName:'اسم العائلة',parentName:'اسم ولي الأمر',className:'الصف',teacher:'المعلم',phone:'الهاتف',email:'البريد الإلكتروني'}[key]||'الحقل')+' أطول من الحد المسموح.');if(s.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email))throw Error('البريد الإلكتروني غير صالح.');const e=enrollment(year());if(s.fee)e.fee=cents(s.fee);e.first=s.first?cents(s.first):Math.round(e.fee*year().firstPercent/100);if(e.first>e.fee)throw Error('رسوم الفصل الأول تتجاوز الرسوم السنوية.');if(s.enrolled&&!validDate(s.enrolled))throw Error('أدخل تاريخ التسجيل بالصيغة سنة-شهر-يوم، مثل 2026-10-31.');e.enrolled=s.enrolled||today();s.enrollment=e;const key=studentKey(s);if(seen.has(key)){action='skip';error='الطالب مكرر داخل الملف.'}else{seen.add(key);const match=db.students.find(x=>studentKey(x)===key);if(match){s.matchId=match.id;action=match.enrollments[db.activeYear]?(mode==='update'?'update':'skip'):'enroll'}}}catch(e){action='error';error=e.message}preview.push({row:i+2,s,action,error})}importState.preview=preview;importState.map=mapping;importState.mode=mode;showImportReview()}
function showImportReview(){const p=importState.preview,counts={add:0,enroll:0,update:0,skip:0,error:0};p.forEach(r=>counts[r.action]++);const html='<form id="importConfirmForm"><div class="importsteps"><span>١ / رفع الملف</span><span>٢ / ربط الأعمدة</span><b>٣ / المراجعة</b></div><div class="summarystrip" style="border-radius:10px;margin-bottom:18px">'+[['جديد',counts.add],['تسجيل',counts.enroll],['تحديث',counts.update],['تجاهل',counts.skip],['أخطاء',counts.error]].map(([k,v])=>'<div>'+k+'<b>'+v+'</b></div>').join('')+'</div>'+(counts.error?'<div class="error">لن تُستورد الصفوف التي تحتوي على أخطاء. يمكنك تنزيل المراجعة وتصحيح هذه الصفوف واستيرادها لاحقًا.</div>':'')+'<div class="tablewrap" style="max-height:330px"><table><thead><tr><th>رقم السطر</th><th>الطالب</th><th>الصف</th><th>النتيجة</th></tr></thead><tbody>'+p.slice(0,150).map(r=>'<tr><td>'+r.row+'</td><td dir="auto">'+esc(fullName(r.s))+'</td><td dir="auto">'+esc(r.s.className)+'</td><td><span class="tag">'+esc(arLabel(r.action))+'</span>'+(r.error?'<div class="small negative">'+esc(r.error)+'</div>':'')+'</td></tr>').join('')+'</tbody></table></div><p class="muted small" style="margin-top:12px">المعروض '+Math.min(150,p.length)+' من '+p.length+' صفوف. تُستخدم افتراضيات السنة '+esc(year().label)+' للتسجيلات الجديدة ما لم تُربط أعمدة الرسوم. لا تُستورد الدفعات.</p><div class="formfoot">'+button('تنزيل المراجعة','import-review-export','download')+'<button class="btn primary" type="submit" '+(counts.add+counts.enroll+counts.update===0?'disabled':'')+'>استيراد '+(counts.add+counts.enroll+counts.update)+' طالبًا</button></div></form>';openModal('هل القائمة جاهزة للاستيراد؟','راجع المعاينة قبل تعديل دليل الطلاب.',html,true)}

صلي.'))closeModal();break}case 'identityForm':{if(!val('name'))throw Error('أدخل اسم المركز.');const next={name:val('name'),currency:val('currency'),contact:val('contact'),email:val('email'),address:val('address')};if(next.currency!==db.settings.currency&&(db.payments.length||db.entries.length)){openModal('تغيير تسمية العملة؟','ستبقى القيم العددية للمبالغ كما هي، دون تحويل بسعر صرف.','<form id="currencyConfirmForm"><div class="helpbox">تغيير '+esc(arLabel(db.settings.currency))+' إلى '+esc(next.currency)+' لجميع السنوات. مثال: سيُعرض 100 '+esc(arLabel(db.settings.currency))+' على أنه 100 '+esc(next.currency)+'.</div><label class="checkline"><input required type="checkbox"><span>أفهم أن هذا يغيّر تسمية العملة دون تحويل المبالغ.</span></label>'+modalFooter('حفظ العملة والبيانات')+'</form>');$('#currencyConfirmForm')._next=next}else mutate(d=>{d.settings=next;audit(d,'تعديل إعدادات المركز',next.name)},'حُفظت إعدادات المركز.');break}case 'currencyConfirmForm':{const next=f._next;if(mutate(d=>{d.settings=next;audit(d,'تعديل العملة وبيانات المركز','العملة labels changed إلى '+next.currency+' دون تحويل المبالغ.')},'حُفظت بيانات المركز.'))closeModal();break}case 'tuitionForm':{const annual=cents(val('annual')),pct=Number(val('firstPercent')),grace=Number(val('grace')),first=Math.round(annual*pct/100);if(!val('label'))throw Error('أدخل اسم السنة الدراسية.');if(db.years.some(y=>y.id!==db.activeYear&&y.label.toLowerCase()===val('label').toLowerCase()))throw Error('اسم السنة الدراسية مستخدم بالفعل.');if(!Number.isInteger(pct)||pct<0||pct>100||!Number.isInteger(grace)||grace<0||grace>120)throw Error('استخدم أعدادًا صحيحة لنسبة الفصل وأيام المهلة.');if(val('finalDue')<val('firstDue'))throw Error('يجب ألا يسبق استحقاق الفصل الثاني استحقاق الفصل الأول.');const apply=f.elements.applyExisting.checked;if(apply){const blocked=roster().find(s=>paid(s,1)>first||paid(s,2)>annual-first);if(blocked)throw Error('لا يمكن التطبيق: '+fullName(blocked)+' لديه دفعات تتجاوز رسوم أحد الفصول الجديدة. أبقِ التوزيع الحالي أو صحّح الدفعة أولًا.')}if(mutate(d=>{const y=d.years.find(y=>y.id===d.activeYear);Object.assign(y,{label:val('label'),annual,firstPercent:pct,grace,firstDue:val('firstDue'),finalDue:val('finalDue')});if(apply)for(const s of d.students.filter(s=>s.enrollments[d.activeYear]))Object.assign(s.enrollments[d.activeYear],{fee:annual,first,firstDue:y.firstDue,finalDue:y.finalDue});audit(d,'تعديل إعدادات الرسوم',y.label+' · '+money(annual)+' سنويًا · '+(apply?'طُبّقت على التسجيلات الحالية':'قيم افتراضية للتسجيلات الجديدة'))},'حُفظت إعدادات الرسوم.')){}break}case 'yearForm':{const annual=cents(val('annual')),pct=Number(val('firstPercent')),grace=Number(val('grace'));if(!val('label'))throw Error('أدخل اسم السنة الدراسية.');if(db.years.some(y=>y.label.toLowerCase()===val('label').toLowerCase()))throw Error('توجد سنة دراسية بهذا الاسم بالفعل.');if(!Number.isInteger(pct)||pct<0||pct>100||!Number.isInteger(grace)||grace<0||grace>120)throw Error('استخدم أعدادًا صحيحة للنسبة وأيام المهلة.');if(val('finalDue')<val('firstDue'))throw Error('يجب ألا يسبق استحقاق الفصل الثاني استحقاق الفصل الأول.');if(mutate(d=>{const y={id:uid(),label:val('label'),annual,firstPercent:pct,grace,firstDue:val('firstDue'),finalDue:val('finalDue')};if(f.elements.rollover.checked)for(const s of d.students.filter(s=>s.enrollments[d.activeYear]))s.enrollments[y.id]=enrollment(y);d.years.push(y);d.activeYear=y.id;audit(d,'إنشاء سنة دراسية',y.label+' · '+(f.elements.rollover.checked?'سُجّل الطلاب الحاليون':'دليل طلاب فارغ'))},'أُنشئت السنة الدراسية الجديدة.'))closeModal();break}case 'freshForm':{const isDemo=f.dataset.demo==='true',next=isDemo?seed():blankDB();if(!isDemo)next.settings={...db.settings,name:val('name')};if(mutate(d=>{const rev=d.revision;Object.keys(d).forEach(k=>delete d[k]);Object.assign(d,next,{revision:rev});audit(d,isDemo?'تحميل بيانات تجريبية':'إنشاء مساحة عمل فارغة',d.settings.name)},isDemo?'حُمّلت البيانات التجريبية.':'مركزك جاهز للاستخدام.',storageFault)){closeModal();studentQuery='';studentClass='';studentStatus='';view='dashboard';render()}break}case 'deleteStudentForm':{if(mutate(d=>{const s=d.students.find(s=>s.id===f.dataset.id);if(d.payments.some(p=>p.studentId===s.id))throw Error('لدى الطالب سجل دفعات.');d.students=d.students.filter(x=>x.id!==s.id);d.reminders=d.reminders.filter(r=>r.studentId!==s.id);audit(d,'حذف طالب',fullName(s))},'حُذف الطالب.')){closeModal();go('students')}break}case 'reminderForm':{if(mutate(d=>{d.reminders.push({id:uid(),at:new Date().toISOString(),year:d.activeYear,studentId:f.dataset.id,term:Number(f.dataset.term)});audit(d,'تسجيل مسودة تذكير',fullName(d.students.find(s=>s.id===f.dataset.id))+' · '+(f.dataset.term==='1'?'الفصل الأول':'الفصل الثاني')+' · لم يُتحقق من وصول الرسالة.')},'سُجّلت مسودة التذكير. يتم الإرسال من تطبيق البريد أو الرسائل على جهازك.'))closeModal();break}case 'importMapForm':prepareImport(f);break;case 'importConfirmForm':{const state=importState;if(mutate(d=>{let count=0;for(const r of state.preview){if(['error','skip'].includes(r.action))continue;const {s}=r,details={firstName:s.firstName,familyName:s.familyName,parentName:s.parentName,className:s.className,teacher:s.teacher,phone:s.phone,email:s.email};if(r.action==='add')d.students.push({id:uid(),...details,note:'',enrollments:{[d.activeYear]:s.enrollment}});else{const existing=d.students.find(x=>x.id===s.matchId);if(r.action==='enroll')existing.enrollments[d.activeYear]=s.enrollment;if(state.mode==='update')for(const k of ['teacher','phone','email'])if(state.map[k]>=0)existing[k]=s[k]}count++}audit(d,'اكتمال استيراد الطلاب',count+' سجلات أُضيفت أو سُجّلت أو حُدّثت؛ '+state.preview.filter(r=>r.action==='error').length+' أخطاء؛ '+state.preview.filter(r=>r.action==='skip').length+' سجلات متجاهلة.')},'اكتمل استيراد الطلاب.')){closeModal();studentQuery='';studentClass='';studentStatus='';studentPage=1;go('students')}break}case 'restoreForm':{const file=$('#restoreFile').files[0];if(!file)throw Error('اختر نسخة احتياطية بصيغة window.addEventListener('storage',e=>{if(e.key===KEY){toast('تغيّرت مساحة العمل في علامة تبويب أخرى. أعد تحميل الصفحة لعرض أحدث السجلات قبل التعديل.',true)}});
function init(){try{const raw=localStorage.getItem(KEY);if(raw){db=validateDB(JSON.parse(raw));loadedRevision=db.revision||0}else{db=seed();db.revision=1;db.savedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db));loadedRevision=1}}catch(e){if(!db)db=blankDB();storageFault=true;toast('تعذّر تحميل البيانات المحفوظة ولم تُستبدل بيانات المتصفح الحالية. استخدم نسخة احتياطية صالحة أو فعّل تخزين المتصفح.',true)}localizeLegacyDemo(db);render()}
